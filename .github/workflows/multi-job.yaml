name: multi-job-workflow

on: 
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:
  job1:
    name: Job 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run job1
        run: echo "This is Job 1."

  job2:
    name: Job 2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run job2
        run: echo "This is Job 2."
  
  job3:
    name: Job 3
    runs-on: ubuntu-latest
    needs: job2
    if: success() # This value is success() by default. If you wish to only run in failure scenarios, you can use failure() instead.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run job3
        run: echo "This is Job 3."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify Python Installation
        run: |
          python --version
          pip --version
          echo "Repository: ${{ vars.REPOSITORY }}"
