name: working with secrets and variables

on:
  push:
  workflow_dispatch:
      
env:
  APP_VERSION: 1.0.0
  APP_NAME: my-app
  ENVIRONMENT: production

jobs:
  basic-env-vars:
    name: Basic Environment Variables
    runs-on: ubuntu-latest
    env:
      APP_CLASS: my-app-class
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print Environment Variables
        run: |
          echo "App Version: ${{ env.APP_VERSION }}"
          echo "App Name: ${{ env.APP_NAME }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "App Class: ${{ env.APP_CLASS }}"

  basic-env-vars2:
    name: Basic Environment Variables 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print Git Variables
        run: |
          echo "App Version: ${{ env.APP_VERSION }}"
          echo "App Name: ${{ env.APP_NAME }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"

  basic-git-variables:
    name: Basic Git Variables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print Git Variables
        run: |
          echo "GITHUB_REPOSITORY: ${{ var.REPOSITORY }}"
          echo "GITHUB_REF: ${{ var.REF }}"
          echo "GITHUB_SHA: ${{ var.SHA }}"
          echo "GITHUB_ACTOR: ${{ var.GITHUB_ACTOR }}"
          echo "GITHUB_EVENT_NAME: ${{ var.EVENT_NAME }}"