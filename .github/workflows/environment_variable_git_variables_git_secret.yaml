name: working with secrets and variables

on:
  push:
  workflow_dispatch:
      
env:
  APP_VERSION: 1.0.0
  APP_NAME: my-app
  ENVIRONMENT: production

jobs:
  basic-env-vars:
    name: Basic Environment Variables
    runs-on: ubuntu-latest
    env:
      APP_CLASS: my-app-class
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print Environment Variables
        run: |
          echo "App Version: ${{ env.APP_VERSION }}"
          echo "App Name: ${{ env.APP_NAME }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "App Class: ${{ env.APP_CLASS }}"

  basic-env-vars2:
    name: Basic Environment Variables 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print Git Variables
        run: |
          echo "App Version: ${{ env.APP_VERSION }}"
          echo "App Name: ${{ env.APP_NAME }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"

  basic-git-variables:
    name: Basic Git Variables
    runs-on: ubuntu-latest
    needs: ["basic-env-vars", "basic-env-vars2"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Print Git Variables
        run: |
          echo "REPOSITORY: ${{ vars.REPOSITORY }}"
          echo "REF: ${{ vars.REF }}"
          echo "SHA: ${{ vars.SHA }}"
          echo "GITHUB_ACTOR: ${{ vars.GITHUB_ACTOR }}"
          echo "EVENT_NAME: ${{ vars.EVENT_NAME }}"